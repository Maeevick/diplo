[workspace]
resolver = "3"
members = ["core", "game", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

# Line tables only: enough for a backtrace, and the debug APK stays small enough to install over USB.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Bevy is slow unoptimised, even while developing.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The game's wasm, sized for the WebView rather than for speed.
[profile.web-release]
inherits = "release"
opt-level = "s"
panic = "abort"
